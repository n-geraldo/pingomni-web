# PingOmni website: the static build plus the tools API.
# Install as /etc/nginx/sites-available/pingomni-web (and link it from sites-enabled).
limit_req_zone $binary_remote_addr zone=pingomni_api:10m rate=60r/m;

server {
    listen 10.4.100.101:8091;
    server_name _;
    root /opt/pingomni-web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Public traffic arrives through the Cloudflare Tunnel (cloudflared on this server), so take the visitor's
    # address from CF-Connecting-IP, but only on requests from the tunnel itself. Rate limits and the tools then see real visitors.
    set_real_ip_from 10.4.100.101;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Compress text: the script bundle shrinks from ~300 KB to ~90 KB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Every page is a real file; anything else is a real 404 (not the home page with status 200).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashed build files never change; screenshots and index.html may be replaced by a rebuild.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~ ^/(shots|og|brand)/ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The RadiusOne demo is its own site (/etc/nginx/sites-available/radiusone-demo); old links go there.
    location ^~ /radiusone/demo {
        return 301 https://demo-radiusone.pingomni.com/?r=/login;
    }

    # Tools API: one PHP entry point in its own PHP-FPM pool (deploy/php-fpm-pool.conf).
    location = /api/ {
        limit_req zone=pingomni_api burst=20 nodelay;
        limit_req_status 429;
        gzip off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/pingomni-web/api/index.php;
        fastcgi_pass unix:/run/php/pingomni.sock;
        fastcgi_buffering off;
        fastcgi_read_timeout 60s;
    }
    location /api/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
