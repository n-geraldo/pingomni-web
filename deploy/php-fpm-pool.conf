; PingOmni tools API: its own small PHP-FPM pool, so slow tools (traceroute, SMTP) never take
; workers from other sites on the server. Install as /etc/php/8.3/fpm/pool.d/pingomni.conf.
[pingomni]
user = www-data
group = www-data
listen = /run/php/pingomni.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
request_terminate_timeout = 60s
php_admin_value[max_execution_time] = 55
php_admin_value[memory_limit] = 64M
php_admin_value[open_basedir] = /opt/pingomni-web/api:/tmp
php_admin_flag[expose_php] = off
