<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Network tools by PingOmni: ping, traceroute, DNS, MX, SPF, DMARC and WHOIS</title>
        <meta name="description" content="Free network and email tools: ping, traceroute, port check, reverse lookup, bandwidth meter, subnet calculators, DNS lookup, MX, NS, SPF, DMARC, DKIM, SMTP, WHOIS and blacklist checks." />
        <meta name="theme-color" content="#151b24" />
        <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
        <script>
            // Apply the saved theme before first paint, so the page never flashes the wrong one.
            try {
                var t = localStorage.getItem('pingomni-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root" data-page="tools"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
