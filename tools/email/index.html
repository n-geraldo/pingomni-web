<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>DNS and email tools by PingOmni: DNS lookup, MX, SPF, DMARC, DKIM and WHOIS</title>
        <meta name="description" content="Free DNS and email tools: DNS lookup (nslookup), MX check, NS check, SPF, DMARC and DKIM checks, SMTP check, WHOIS and blacklist check." />
        <meta name="theme-color" content="#151b24" />
        <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
        <script>
            // Apply the saved theme before first paint, so the page never flashes the wrong one.
            try {
                var t = localStorage.getItem('pingomni-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root" data-page="tools-email" data-root="../../"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
