        <script>
            // Apply the saved theme before first paint, so the page never flashes the wrong one.
            try {
                var t = localStorage.getItem('pingomni-theme');
                if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
        <!-- The opening: the Pulse draws itself once per visit (not again while the tab stays open), then fades. -->
        <script>try{sessionStorage.getItem('po-splash')?document.documentElement.classList.add('po-seen'):sessionStorage.setItem('po-splash','1')}catch(e){}</script>
        <style>
            #po-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:var(--surface,#fff);color:var(--wordmark,#0f2226);pointer-events:none;animation:po-out .35s ease-in 1.3s forwards}
            #po-splash svg{width:112px;height:112px;overflow:visible}
            #po-splash .b{stroke-dasharray:1;stroke-dashoffset:1;animation:po-draw .7s cubic-bezier(.65,0,.25,1) .1s forwards}
            #po-splash .p{fill:var(--pulse-dot,#0d9488);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:po-pop .32s cubic-bezier(.3,1.6,.5,1) .72s forwards}
            #po-splash .r{fill:none;stroke:var(--pulse-dot,#0d9488);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:po-ring .8s ease-out .85s}
            #po-splash .e{fill:none;stroke:var(--pulse-dot,#0d9488);stroke-width:3.5;stroke-linecap:round;opacity:0;animation:po-echo .4s ease-out .95s forwards}
            .po-seen #po-splash{display:none}
            @media (prefers-reduced-motion:reduce){#po-splash{display:none}}
            @keyframes po-draw{to{stroke-dashoffset:0}}
            @keyframes po-pop{to{transform:scale(1)}}
            @keyframes po-ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
            @keyframes po-echo{to{opacity:.55}}
            @keyframes po-out{to{opacity:0;visibility:hidden}}
        </style>
    </head>
    <body>
        <div id="po-splash" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="b" pathLength="1" d="M4 32H20L24 22L32 42L36 32H46" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle class="r" cx="46" cy="32" r="5.5"/><path class="e" d="M54.43 24.93A11 11 0 0 1 54.43 39.07"/><circle class="p" cx="46" cy="32" r="5.5"/></svg></div>

    </body>
